<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dashboard interativo com múltiplas fontes de dados.">
  <title>Atlas de Dados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}?v=2.1.0">
  <script src="{{ url_for('static', path='app.js') }}?v=2.1.0" defer></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand-mark" aria-hidden="true">AD</div>
      <div><p class="eyebrow">Painéis integrados</p><h1>Atlas de Dados</h1></div>
      <nav class="source-menu" aria-label="Fonte de dados">
        <label for="source">Fonte</label>
        <select id="source"><option value="vendas">Vendas</option><option value="violencia">Violência 2025</option></select>
      </nav>
      <div class="period" id="period">Carregando período…</div>
    </header>

    <main>
      <section class="hero">
        <div><p class="kicker" id="kicker">Visão executiva</p><h2 id="hero-title">O pulso das vendas,<br><em>mês a mês.</em></h2><p class="intro" id="intro">Explore faturamento, volume, marcas e presença global.</p></div>
        <div class="filters" id="filters" aria-label="Filtros do dashboard"></div>
      </section>

      <div class="load-progress" id="load-progress" role="progressbar" aria-label="Carregamento do dashboard" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
      <div id="dashboard" aria-live="polite" aria-busy="true"></div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>
    <footer><span id="source-note">Fonte: Vendas.xlsx</span><a href="/docs">Documentação da API</a></footer>
  </div>
</body>
</html>
